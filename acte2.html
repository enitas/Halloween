<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta charset="utf-8" />
    <title>Acte II — Réseau Souterrain & Impulsion</title>

    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Leaflet (Carte Interactive) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      body {
        margin: 0;
        padding: 15px;
        background-color: #050202;
        color: #ff3333;
        font-family: 'Courier New', monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }

      .container {
        width: 100%;
        max-width: 480px;
        background: rgba(15, 0, 0, 0.95);
        border: 1px solid #ff3333;
        padding: 15px;
        box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        border-radius: 6px;
        box-sizing: border-box;
        transition: transform 0.05s ease;
      }

      /* Effet Shake (Tremblement console) */
      .shake {
        animation: shakeAnim 0.4s cubic-bezier(.36,.07,.19,.97) both;
      }

      @keyframes shakeAnim {
        10%, 90% { transform: translate3d(-2px, 0, 0); }
        20%, 80% { transform: translate3d(4px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
        40%, 60% { transform: translate3d(6px, 0, 0); }
      }

      h1 {
        font-size: 1.1rem;
        letter-spacing: 2px;
        text-align: center;
        margin-top: 0;
        margin-bottom: 12px;
        text-shadow: 0 0 10px #ff0000;
      }

      .team-info {
        font-size: 0.75rem;
        color: #aaa;
        margin-bottom: 10px;
        text-align: right;
      }

      .alert-banner {
        background: #2a0000;
        border: 1px solid #ff0000;
        color: #ff8888;
        padding: 8px 12px;
        font-size: 0.75rem;
        border-radius: 4px;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .danger-tag {
        background: #ff0000;
        color: #000;
        font-weight: bold;
        padding: 2px 6px;
        border-radius: 2px;
        font-size: 0.65rem;
      }

      /* Carte & GPS */
      .gps-box {
        background: #0a0000;
        border: 1px solid #800000;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 4px;
      }

      .gps-coords {
        font-size: 0.75rem;
        color: #ffaaaa;
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      #map {
        width: 100%;
        height: 220px;
        border: 1px solid #ff3333;
        border-radius: 4px;
        background: #111;
        position: relative;
      }

      /* Onde Sonar sur la Carte */
      .sonar-wave {
        border: 2px solid #00ff00;
        border-radius: 50%;
        position: absolute;
        background: rgba(0, 255, 0, 0.2);
        animation: pulseWave 1.8s ease-out infinite;
        pointer-events: none;
      }

      @keyframes pulseWave {
        0% { transform: scale(0.1); opacity: 1; }
        100% { transform: scale(3.5); opacity: 0; }
      }

      /* Card Puits Mairie */
      .target-card {
        background: #100000;
        border: 1px dashed #ff3333;
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 15px;
        text-align: center;
        transition: all 0.3s;
      }

      .target-card.active {
        background: #002200;
        border: 1px solid #00ff00;
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
      }

      .target-title {
        font-size: 0.9rem;
        font-weight: bold;
        color: #fff;
        margin-bottom: 4px;
      }

      .target-gps {
        font-size: 0.7rem;
        color: #ff8888;
        margin-bottom: 8px;
      }

      .target-status {
        font-size: 0.8rem;
        font-weight: bold;
        color: #ff3333;
      }

      /* Terminal avec balayage CRT */
      .terminal-box {
        background: #000;
        border: 1px solid #800000;
        padding: 12px;
        min-height: 80px;
        font-size: 0.8rem;
        line-height: 1.4;
        color: #ffaaaa;
        border-radius: 4px;
        margin-bottom: 15px;
        position: relative;
        overflow: hidden;
      }

      .terminal-box::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
        background-size: 100% 4px;
        pointer-events: none;
      }

      .action-btn {
        background: #ff3333;
        color: #000;
        border: none;
        padding: 12px;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        border-radius: 4px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>

    <div class="container" id="main-container">
      <h1>ACTE II : RÉSEAU SOUTERRAIN</h1>

      <div class="team-info">ÉQUIPE : <strong id="team-name" style="color:#fff;">---</strong></div>

      <div class="alert-banner">
        <span>ANOMALIE RÉSEAU DÉTECTÉE</span>
        <span class="danger-tag">DANGER : MODÉRÉ</span>
      </div>

      <!-- Carte & GPS -->
      <div class="gps-box">
        <div class="gps-coords">
          <span id="gps-status">GPS : RECHERCHE...</span>
          <span id="gps-acc"></span>
        </div>
        <div id="map"></div>
      </div>

      <!-- Cible Puits Mairie -->
      <div class="target-card" id="target-card">
        <div class="target-title">2. PUITS MAIRIE</div>
        <div class="target-gps">N 47° 11,085' E 2° 36,823'</div>
        <div class="target-status" id="target-status">SIGNAL NON DÉTECTÉ</div>
      </div>

      <!-- Console réseau -->
      <div class="terminal-box" id="terminal">
        <em>Approchez-vous du Puits de la Mairie et scannez la puce NFC pour analyser le réseau souterrain...</em>
      </div>

      <button class="action-btn" id="trigger-strobo-btn" style="display:none;">DÉCLENCHER L'IMPULSION SOUTERRAINE</button>
    </div>

    <script>
      // 1. CONFIGURATION SUPABASE ET ÉQUIPE
      const SUPABASE_URL = "https://iirqiuymgwlivhxwbwlz.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpcnFpdXltZ3dsaXZoeHdid2x6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDA5NjQsImV4cCI6MjEwNjI3Njk2NH0.tVaRU9S3qL01gj_FzsnoLT4j7ywKSc8Qz96fT8bK-yk";
      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const currentTeam = localStorage.getItem('rians_team') || 'TEAM1';
      document.getElementById('team-name').innerText = currentTeam;

      // 2. CIBLE : PUITS MAIRIE
      const PUITS_MAIRIE = {
        id: "puits_mairie",
        name: "PUITS MAIRIE",
        lat: 47.184750,
        lng: 2.613717,
        gpsStr: "N 47° 11,085' E 2° 36,823'"
      };

      // 3. CARTE LEAFLET
      const map = L.map('map').setView([PUITS_MAIRIE.lat, PUITS_MAIRIE.lng], 18);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      const targetMarker = L.circleMarker([PUITS_MAIRIE.lat, PUITS_MAIRIE.lng], {
        color: '#ff0000',
        fillColor: '#ff0000',
        fillOpacity: 0.8,
        radius: 10
      }).addTo(map).bindPopup(`<b>${PUITS_MAIRIE.name}</b><br><small>${PUITS_MAIRIE.gpsStr}</small>`);

      let playerMarker = null;

      // 4. GÉOLOCALISATION GPS
      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition((pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          document.getElementById('gps-status').innerText = `GPS: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
          document.getElementById('gps-acc').innerText = `±${Math.round(pos.coords.accuracy)}m`;

          if (!playerMarker) {
            playerMarker = L.marker([lat, lng]).addTo(map).bindPopup("<b>POSITION JOUEUR</b>");
          } else {
            playerMarker.setLatLng([lat, lng]);
          }
        }, null, { enableHighAccuracy: true });
      }

      // 5. MOTEUR D'IMPULSION IMMERSIVE (AUDIO + VIBRATION + SHAKE + SONAR)
      function playImpulseSound() {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(60, audioCtx.currentTime); // Basse fréquence 60Hz
          osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 1.2);

          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.4);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + 1.4);
        } catch (e) {
          console.log("Audio non actif");
        }
      }

      function triggerAdvancedImpulse() {
        // Vibration haptique
        if ("vibrate" in navigator) {
          navigator.vibrate([100, 50, 100, 50, 400]);
        }

        // Son synthétisé
        playImpulseSound();

        // Screen Shake
        const container = document.getElementById('main-container');
        container.classList.add('shake');
        setTimeout(() => container.classList.remove('shake'), 400);

        // Onde Sonar sur la carte
        const sonarMarker = L.marker([PUITS_MAIRIE.lat, PUITS_MAIRIE.lng], {
          icon: L.divIcon({
            className: 'sonar-wave',
            iconSize: [60, 60],
            iconAnchor: [30, 30]
          })
        }).addTo(map);

        setTimeout(() => {
          map.removeLayer(sonarMarker);
        }, 5000);
      }

      // 6. VALIDATION ET SYNCHRO SUPABASE
      const targetCard = document.getElementById('target-card');
      const targetStatus = document.getElementById('target-status');
      const terminal = document.getElementById('terminal');
      const stroboBtn = document.getElementById('trigger-strobo-btn');

      async function validatePuitsMairie() {
        targetCard.classList.add('active');
        targetStatus.innerText = "CAPTURÉ — PROTOCOLE NFC VALIDE";
        targetStatus.style.color = "#00ff00";

        terminal.innerHTML = `<strong>ANALYSE DU RÉSEAU SOUTERRAIN :</strong><br>Puce NFC identifiée.<br>Première impulsion transmise avec succès.`;

        stroboBtn.style.display = "block";
        triggerAdvancedImpulse();

        // Enregistrement
        try {
          let localTokens = JSON.parse(localStorage.getItem(`rians_tokens_${currentTeam}`) || '[]');
          if (!localTokens.includes('puits_mairie')) localTokens.push('puits_mairie');
          localStorage.setItem(`rians_tokens_${currentTeam}`, JSON.stringify(localTokens));

          await db.from('equipes').upsert({
            code_equipe: currentTeam,
            acte2_balises: localTokens,
            updated_at: new Date().toISOString()
          });
        } catch (e) {
          console.error("Erreur d'enregistrement Supabase :", e);
        }
      }

      // 7. DÉTECTION NFC (?token=puits_mairie)
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (token === 'puits_mairie' || token === 'balise2') {
        validatePuitsMairie();
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      stroboBtn.addEventListener('click', () => {
        triggerAdvancedImpulse();
        terminal.innerHTML += `<br><span style="color:#00ff00;">> IMPULSION RÉÉMISE DANS LE RÉSEAU.</span>`;
      });
    </script>
  </body>
</html>
