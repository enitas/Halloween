<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta charset="utf-8" />
    <title>Acte I Bis — Captures, GPS & Serment</title>
    
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Leaflet (Carte Interactive) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      body {
        margin: 0;
        padding: 15px;
        background-color: #050202;
        color: #ff3333;
        font-family: 'Courier New', monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }

      .container {
        width: 100%;
        max-width: 480px;
        background: rgba(15, 0, 0, 0.95);
        border: 1px solid #ff3333;
        padding: 15px;
        box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        border-radius: 6px;
        box-sizing: border-box;
      }

      h1 {
        font-size: 1.2rem;
        letter-spacing: 2px;
        text-align: center;
        margin-top: 0;
        margin-bottom: 12px;
        text-shadow: 0 0 10px #ff0000;
      }

      /* Section Équipe */
      .team-box {
        background: #110000;
        border: 1px solid #660000;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 4px;
      }

      .team-inputs {
        display: flex;
        gap: 8px;
        margin-top: 5px;
      }

      .team-inputs input {
        flex: 1;
        background: #000;
        border: 1px solid #ff3333;
        color: #fff;
        padding: 8px;
        font-family: inherit;
        text-transform: uppercase;
        font-weight: bold;
      }

      .team-inputs button {
        background: #ff3333;
        color: #000;
        border: none;
        padding: 8px 12px;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
      }

      .status-line {
        font-size: 0.75rem;
        color: #888;
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
      }

      .status-badge {
        color: #ff3333;
        font-weight: bold;
      }

      .status-badge.online {
        color: #00ff00;
      }

      /* Bloc GPS & Carte */
      .gps-box {
        background: #0a0000;
        border: 1px solid #800000;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 4px;
      }

      .gps-coords {
        font-size: 0.75rem;
        color: #ffaaaa;
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      #map {
        width: 100%;
        height: 220px;
        border: 1px solid #ff3333;
        border-radius: 4px;
        background: #111;
      }

      /* Cartes Balises */
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 15px;
      }

      .card {
        background: #100000;
        border: 1px dashed #660000;
        padding: 10px 5px;
        text-align: center;
        border-radius: 4px;
        transition: all 0.3s;
      }

      .card.found {
        background: #002200;
        border: 1px solid #00ff00;
        box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
      }

      .card-title {
        font-size: 0.75rem;
        color: #aaa;
        margin-bottom: 5px;
      }

      .card-status {
        font-size: 0.7rem;
        font-weight: bold;
        color: #ff3333;
      }

      /* Signal / Display */
      .count-header {
        font-size: 0.85rem;
        text-align: center;
        margin-bottom: 8px;
        font-weight: bold;
      }

      .display-box {
        background: #000;
        border: 1px solid #800000;
        padding: 12px;
        min-height: 70px;
        font-size: 0.85rem;
        line-height: 1.4;
        color: #ffaaaa;
        margin-bottom: 15px;
        border-radius: 4px;
      }

      /* Énigme finale */
      .puzzle-box {
        background: #150000;
        border: 1px solid #ff3333;
        padding: 15px;
        border-radius: 4px;
        text-align: center;
      }

      .puzzle-box p {
        font-size: 0.8rem;
        color: #ffaaaa;
        margin-top: 0;
      }

      .puzzle-box textarea {
        width: 100%;
        height: 60px;
        background: #000;
        border: 1px solid #ff3333;
        color: #00ff00;
        padding: 8px;
        font-family: inherit;
        font-size: 0.85rem;
        box-sizing: border-box;
        margin-bottom: 10px;
        resize: none;
        text-transform: uppercase;
      }

      .puzzle-box button {
        background: #ff3333;
        color: #000;
        border: none;
        padding: 10px 20px;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
      }

      #status-msg {
        font-size: 0.8rem;
        font-weight: bold;
        margin-top: 10px;
        min-height: 20px;
      }
    </style>
  </head>
  <body>

    <div class="container">
      <h1>ACTE I BIS : LE SERMENT & GPS</h1>

      <!-- Identifiant Équipe -->
      <div class="team-box">
        <span style="font-size: 0.8rem; color: #ffaaaa;">ÉQUIPE :</span>
        <div class="team-inputs">
          <input type="text" id="team-code-input" placeholder="EX: TEAM1" />
          <button id="set-team-btn">OK</button>
        </div>
        <div class="status-line">
          <span>SYNCHRO SUPABASE :</span>
          <span id="synchro-status" class="status-badge">RECHERCHE...</span>
        </div>
      </div>

      <!-- Coordonnées GPS & Carte -->
      <div class="gps-box">
        <div class="gps-coords">
          <span id="gps-status">GPS : RECHERCHE...</span>
          <span id="gps-acc"></span>
        </div>
        <div id="map"></div>
      </div>

      <!-- Statut des 3 Balises -->
      <div class="cards-grid">
        <div class="card" id="card-1">
          <div class="card-title">BALISE 1</div>
          <div class="card-status" id="status-1">ABSENT</div>
        </div>
        <div class="card" id="card-2">
          <div class="card-title">BALISE 2</div>
          <div class="card-status" id="status-2">ABSENT</div>
        </div>
        <div class="card" id="card-3">
          <div class="card-title">BALISE 3</div>
          <div class="card-status" id="status-3">ABSENT</div>
        </div>
      </div>

      <!-- Affichage Fragments -->
      <div class="count-header" id="signals-count">0/3 CAPTURE(S)</div>
      <div class="display-box" id="fragments-display">
        <em>Recherche des signaux d'équipe...</em>
      </div>

      <!-- Énigme finale -->
      <div class="puzzle-box" id="puzzle-section" style="display: none;">
        <p><strong>RECONSTITUEZ LE SERMENT :</strong><br>Assemblez tous les fragments capturés pour réciter la formule magique.</p>
        <textarea id="sentence-input" placeholder="SAISISSEZ LA PHRASE COMPLETE ICI..."></textarea>
        <button id="validate-btn">RÉCITER LE SERMENT</button>
        <div id="status-msg"></div>
      </div>
    </div>

    <script>
      // 1. CONFIGURATION SUPABASE
      const SUPABASE_URL = "https://iirqiuymgwlivhxwbwlz.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpcnFpdXltZ3dsaXZoeHdid2x6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDA5NjQsImV4cCI6MjEwNjI3Njk2NH0.tVaRU9S3qL01gj_FzsnoLT4j7ywKSc8Qz96fT8bK-yk";
      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // 2. GESTION ÉQUIPE
      let currentTeam = localStorage.getItem('rians_team') || 'TEAM1';
      const teamInput = document.getElementById('team-code-input');
      const setTeamBtn = document.getElementById('set-team-btn');
      const synchroStatus = document.getElementById('synchro-status');

      teamInput.value = currentTeam;

      setTeamBtn.addEventListener('click', () => {
        const val = teamInput.value.trim().toUpperCase();
        if (val) {
          currentTeam = val;
          localStorage.setItem('rians_team', currentTeam);
          setupRealtimeSync();
          syncData();
        }
      });

      // 3. POSITIONS DES BALISES (Rians / Modifiables si besoin)
      const BALISE_POSITIONS = {
        'balise1': { lat: 43.5905, lng: 5.7580, label: "Balise 1 - L'Eau" },
        'balise2': { lat: 43.5912, lng: 5.7592, label: "Balise 2 - La Mort" },
        'balise3': { lat: 43.5898, lng: 5.7570, label: "Balise 3 - L'Attente" }
      };

      // 4. CARTE LEAFLET
      const map = L.map('map').setView([43.5905, 5.7580], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      let playerMarker = null;
      let baliseMarkers = {};

      // Initialisation des marqueurs de balises sur la carte
      Object.keys(BALISE_POSITIONS).forEach(id => {
        const pos = BALISE_POSITIONS[id];
        const m = L.circleMarker([pos.lat, pos.lng], {
          color: '#ff3333',
          fillColor: '#ff0000',
          fillOpacity: 0.7,
          radius: 8
        }).addTo(map).bindPopup(pos.label);
        baliseMarkers[id] = m;
      });

      // 5. GÉOLOCALISATION GPS EN DIRECT
      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const acc = Math.round(position.coords.accuracy);

            document.getElementById('gps-status').innerText = `GPS: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            document.getElementById('gps-acc').innerText = `±${acc}m`;

            if (!playerMarker) {
              playerMarker = L.marker([lat, lng]).addTo(map).bindPopup("VOUS ÉTES ICI").openPopup();
              map.setView([lat, lng], 17);
            } else {
              playerMarker.setLatLng([lat, lng]);
            }
          },
          (error) => {
            document.getElementById('gps-status').innerText = "GPS : SIGNAL PERDU";
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }

      // 6. GESTION DES SCAN BALISES (URL ?token=balise1)
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      // Éléments DOM
      const card1 = document.getElementById('card-1');
      const card2 = document.getElementById('card-2');
      const card3 = document.getElementById('card-3');
      const status1 = document.getElementById('status-1');
      const status2 = document.getElementById('status-2');
      const status3 = document.getElementById('status-3');
      const countDisplay = document.getElementById('signals-count');
      const display = document.getElementById('fragments-display');
      const puzzleSection = document.getElementById('puzzle-section');

      // 7. MISE À JOUR DE L'INTERFACE & CARTE
      function updateUI(balises) {
        let fragmentsText = [];

        // Reset
        card1.classList.remove('found'); status1.innerText = "ABSENT"; status1.style.color = "#ff3333";
        card2.classList.remove('found'); status2.innerText = "ABSENT"; status2.style.color = "#ff3333";
        card3.classList.remove('found'); status3.innerText = "ABSENT"; status3.style.color = "#ff3333";

        // Marqueurs carte
        Object.keys(baliseMarkers).forEach(id => {
          if (balises.includes(id)) {
            baliseMarkers[id].setStyle({ color: '#00ff00', fillColor: '#00ff00' });
          } else {
            baliseMarkers[id].setStyle({ color: '#ff3333', fillColor: '#ff0000' });
          }
        });

        if (balises.includes('balise1')) {
          card1.classList.add('found'); status1.innerText = "CAPTURES"; status1.style.color = "#00ff00";
          fragmentsText.push("1. L'EAU QUI DORT");
        }
        if (balises.includes('balise2')) {
          card2.classList.add('found'); status2.innerText = "CAPTURES"; status2.style.color = "#00ff00";
          fragmentsText.push("2. NE MEURT JAMAIS");
        }
        if (balises.includes('balise3')) {
          card3.classList.add('found'); status3.innerText = "CAPTURES"; status3.style.color = "#00ff00";
          fragmentsText.push("3. ELLE ATTEND ICI");
        }

        countDisplay.innerText = `${balises.length}/3 CAPTURE(S)`;

        if (fragmentsText.length > 0) {
          display.innerHTML = `<strong>FRAGMENTS (ÉQUIPE ${currentTeam}) :</strong><br><br>` + fragmentsText.join('<br>');
        } else {
          display.innerHTML = "<em>Aucun fragment détecté. Approchez-vous d'une balise NFC.</em>";
        }

        if (balises.length >= 3) {
          puzzleSection.style.display = 'block';
        } else {
          puzzleSection.style.display = 'none';
        }
      }

      // 8. SYNCHRONISATION SUPABASE (LECTURE/ÉCRITURE)
      async function syncData(newToken = null) {
        let localTokens = JSON.parse(localStorage.getItem(`rians_tokens_${currentTeam}`) || '[]');
        if (newToken && !localTokens.includes(newToken)) {
          localTokens.push(newToken);
          localStorage.setItem(`rians_tokens_${currentTeam}`, JSON.stringify(localTokens));
        }

        try {
          let { data } = await db.from('equipes').select('balises').eq('code_equipe', currentTeam).maybeSingle();
          let remoteBalises = (data && data.balises) ? data.balises : [];
          
          let merged = Array.from(new Set([...remoteBalises, ...localTokens]));

          if (JSON.stringify(merged) !== JSON.stringify(remoteBalises) || !data) {
            localStorage.setItem(`rians_tokens_${currentTeam}`, JSON.stringify(merged));
            await db.from('equipes').upsert({
              code_equipe: currentTeam,
              balises: merged,
              updated_at: new Date().toISOString()
            });
          } else {
            localStorage.setItem(`rians_tokens_${currentTeam}`, JSON.stringify(merged));
          }

          synchroStatus.innerText = "CONNECTÉ";
          synchroStatus.className = "status-badge online";
          updateUI(merged);
        } catch (e) {
          console.error("Erreur synchro :", e);
          synchroStatus.innerText = "SANS RESEAU";
          synchroStatus.className = "status-badge";
          updateUI(localTokens);
        }
      }

      // 9. ÉCOUTE TEMPS RÉEL + REFRESH AUTOMATIQUE (POLLING 3 SECONDES)
      let activeChannel = null;

      function setupRealtimeSync() {
        if (activeChannel) db.removeChannel(activeChannel);

        activeChannel = db.channel(`room_${currentTeam}_${Date.now()}`)
          .on('postgres_changes', { 
            event: '*', 
            schema: 'public', 
            table: 'equipes', 
            filter: `code_equipe=eq.${currentTeam}` 
          }, (payload) => {
            if (payload.new && payload.new.balises) {
              let localTokens = JSON.parse(localStorage.getItem(`rians_tokens_${currentTeam}`) || '[]');
              let merged = Array.from(new Set([...payload.new.balises, ...localTokens]));
              localStorage.setItem(`rians_tokens_${currentTeam}`, JSON.stringify(merged));
              updateUI(merged);
            }
          })
          .subscribe();
      }

      // Traitement initial du scan
      syncData(token);
      setupRealtimeSync();

      // Polling de secours toutes les 3 secondes
      setInterval(() => {
        syncData();
      }, 3000);

      // Nettoyage URL
      if (token) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      // 10. VALIDATION PHRASE FINALE
      const validateBtn = document.getElementById('validate-btn');
      const sentenceInput = document.getElementById('sentence-input');
      const statusMsg = document.getElementById('status-msg');
      const PHRASE_SECRETE = "L'EAU QUI DORT NE MEURT JAMAIS ELLE ATTEND ICI";

      validateBtn.addEventListener('click', () => {
        const userText = sentenceInput.value.trim().toUpperCase().replace(/[']/g, "'").replace(/\s+/g, ' ');

        if (userText === PHRASE_SECRETE) {
          statusMsg.style.color = "#00ff00";
          statusMsg.innerText = "SERMENT ACCEPTÉ. PASSAGE À L'ACTE II...";
          setTimeout(() => {
            window.location.href = "acte2.html";
          }, 2000);
        } else {
          statusMsg.style.color = "#ff3333";
          statusMsg.innerText = "PHRASE INCORRECTE. L'ESPRIT REFUSE CE MOT.";
        }
      });
    </script>
  </body>
</html>
